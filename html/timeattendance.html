<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Check-in Barcode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
    .icon-overlay {
        animation: popIn 0.3s ease-out forwards;
    }
    @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    /* BỔ SUNG: Ép hiển thị viền khung quét trên Android */
    #reader canvas.qr-shaded-region {
        opacity: 0.6 !important;
    }
    #reader__scan_region {
        background: transparent !important;
    }
    #reader__scan_region img {
        opacity: 0.8 !important;
    }
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 space-y-5 border border-slate-700">
        <h1 class="text-2xl font-black text-center text-cyan-400 tracking-wide">CHECK-IN NHÂN VIÊN</h1>

        <!-- Khung quét Camera -->
        <div class="relative rounded-xl overflow-hidden border-2 border-slate-600 bg-black min-h-[220px]">
            <div id="reader" class="w-full"></div>
            <!-- Kết nối tới data -->       
            <div id="status-sync" class="text-base text-center text-slate-400 py-1.5 font-medium">Đang đồng bộ dữ liệu...</div>
            
            <!-- Màn hình hiển thị Tick (✓) hoặc Cross (✕) đè lên camera -->
            <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center hidden z-50 p-2">
            <div id="overlay-icon" class="text-[10rem] leading-none font-black icon-overlay"></div>
            <div id="overlay-msg" class="text-4xl sm:text-5xl font-black mt-1 text-center tracking-wider"></div>
            <div id="overlay-detail" class="text-2xl font-black mt-2 text-center text-white leading-tight"></div>
            </div>
        </div>

        <!-- Khung Nhập Tay & Giọng Nói -->
<div class="space-y-2 pt-1">
    <div class="flex items-center gap-2 w-full">
        <!-- Ô Nhập:  -->
        <input type="text" id="manual-input" value="P" placeholder="Nhập phần số..." 
            inputmode="numeric" pattern="[0-9]*"
            class="flex-1 w-0 bg-slate-700 text-white px-3 py-2 rounded-lg text-base font-bold border border-slate-600 focus:outline-none focus:border-cyan-400">
        
        <!-- Nút Giọng nói -->
        <button id="voice-btn" type="button" onclick="toggleVoiceRecognition()" title="Đọc Mã NV bằng giọng nói"
            class="shrink-0 bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg border border-slate-600 text-cyan-400 flex items-center justify-center transition-colors active:scale-95">
            <svg class="w-5 h-5 fill-current pointer-events-none" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
        
        <!-- Nút Gửi:-->
        <button onclick="handleManualSubmit()" 
            class="shrink-0 bg-cyan-600 hover:bg-cyan-500 font-bold px-3.5 py-2 rounded-lg text-sm whitespace-nowrap transition-colors active:scale-95">
            Gửi
        </button>
    </div>
    <div id="voice-status" class="text-xs font-semibold text-center text-yellow-400 hidden">🔴 Đang nghe... Hãy đọc Mã NV</div>
</div>

        <div class="text-center text-xs text-slate-400">
            Đưa mã barcode trên thẻ nhân viên vào khung hình hoặc nhập mã trực tiếp
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxVgyzAv2NwNgBPTmnlsiKQzWis7mz3LKTJXQwV_VVOUd-IxZWLiU-zMvqRrbtJB_mD/exec"; 
        
        let employeeDatabase = [];
        let isProcessing = false;

        // Fetch danh sách nhân viên từ Google Sheets
        async function fetchEmployees() {
            try {
                const res = await fetch(API_URL);
                employeeDatabase = await res.json();
                document.getElementById('status-sync').innerText = `✓ Danh sách có ${employeeDatabase.length} nhân viên`;
                document.getElementById('status-sync').className = "text-xs text-center text-green-400 font-medium py-1";
            } catch (err) {
                document.getElementById('status-sync').innerText = '✗ Lỗi kết nối Google Sheets!';
                document.getElementById('status-sync').className = "text-xs text-center text-red-400 font-medium py-1";
            }
        }

        // Ghi lịch sử check-in vào Google Sheets
        async function logCheckin(logData) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(logData)
                });
            } catch (e) {
                console.error("Lỗi ghi log:", e);
            }
        }

        // Xử lý sự kiện Quét Barcode thành công
        function onScanSuccess(decodedText) {
            processCheckin(decodedText);
        }

        // Hàm xử lý chung cho Quét Barcode, Nhập tay và Giọng nói
        function processCheckin(rawInput) {
            if (isProcessing || !rawInput) return;
            isProcessing = true;

            const scannedId = rawInput.trim().toUpperCase().replace(/\s+/g, '');
            const employee = employeeDatabase.find(emp => emp.id.toUpperCase() === scannedId);

            const overlay = document.getElementById('overlay');
            const overlayIcon = document.getElementById('overlay-icon');
            const overlayMsg = document.getElementById('overlay-msg');
            const overlayDetail = document.getElementById('overlay-detail');

            overlay.classList.remove('hidden', 'bg-emerald-600/90', 'bg-rose-600/90');

            if (employee) {
                overlay.classList.add('bg-emerald-600/90');
                overlayIcon.innerHTML = '✓';
                overlayMsg.innerText = 'HỢP LỆ';

                const shiftInfo = employee.shift ? `<br><span class="text-xl text-yellow-300 font-black">Ca: ${employee.shift}</span>` : '';
                overlayDetail.innerHTML = `${employee.name} (${employee.id})${shiftInfo}`;
                
                logCheckin({
                    id: employee.id,
                    name: employee.name,
                    status: "Hợp lệ"
                });
            } else {
                overlay.classList.add('bg-rose-600/95');
                overlayIcon.innerHTML = '✕';
                overlayMsg.innerText = 'KHÔNG HỢP LỆ';
                
                overlayDetail.innerText = `Mã: ${scannedId}`;

                logCheckin({
                    id: scannedId,
                    name: "N/A",
                    status: "Không hợp lệ"
                });
            }
            
            fetchEmployees();

            document.getElementById('manual-input').value = '';
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                isProcessing = false;
            }, 2500);
        }

        // Xử lý khi nhập tay
        function handleManualSubmit() {
            const val = document.getElementById('manual-input').value;
            processCheckin(val);
        }

        document.getElementById('manual-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleManualSubmit();
            }
        });

        const manualInput = document.getElementById('manual-input');

        manualInput.addEventListener('input', function(e) {
            let val = this.value.toUpperCase();
            
            if (!val.startsWith('P')) {
                val = 'P' + val.replace(/[^0-9]/g, '');
            } else {
                val = 'P' + val.slice(1).replace(/[^0-9]/g, '');
            }
            
            this.value = val;
        });
        
        // XỬ LÝ GIỌNG NÓI - TỰ ĐỘNG LỌC LẤY SỐ VÀ NỐI CHỮ 'P'
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                const statusEl = document.getElementById('voice-status');
                statusEl.innerText = "🔴 Đang nghe... Chỉ cần đọc phần SỐ";
                statusEl.classList.remove('hidden');
            };

            recognition.onend = function() {
                document.getElementById('voice-status').classList.add('hidden');
            };

            recognition.onresult = function(event) {
                const rawSpeech = event.results[0][0].transcript;
                
                const digitsOnly = rawSpeech.replace(/\D/g, '');

                if (digitsOnly) {
                    const finalEmployeeId = 'P' + digitsOnly;
                    
                    document.getElementById('manual-input').value = finalEmployeeId;
                    processCheckin(finalEmployeeId);
                } else {
                    alert("Không nhận diện được số nào! Vui lòng đọc rõ phần chữ số.");
                }
            };

            recognition.onerror = function(event) {
                console.error("Lỗi giọng nói:", event.error);
                document.getElementById('voice-status').classList.add('hidden');
                
                if (event.error === 'not-allowed') {
                    alert("Bạn cần cấp quyền truy cập Micro cho ứng dụng/trình duyệt!");
                } else if (event.error === 'service-not-allowed') {
                    alert("Điện thoại yêu cầu trang web chạy kết nối HTTPS (https://) để mở Micro!");
                } else {
                    alert("Lỗi nhận diện giọng nói: " + event.error);
                }
            };
        }

        function toggleVoiceRecognition() {
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                alert("Nhận diện giọng nói trên điện thoại bắt buộc web phải chạy qua HTTPS (https://)!");
                return;
            }

            if (!recognition) {
                alert("Trình duyệt này không hỗ trợ Web Speech API! Bạn nên mở trên Chrome (Android) hoặc Safari (iOS).");
                return;
            }

            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        }


const html5QrCode = new Html5Qrcode("reader");

// Đảm bảo DOM đã load xong kích thước khung chứa trước khi bật Camera
window.addEventListener("DOMContentLoaded", () => {
    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 15,
            qrbox: { width: 260, height: 160 },
            showTorchButtonIfSupported: true
        },
        onScanSuccess,
        (errorMessage) => {
            // Lỗi quét khung hình bình thường
        }
    ).catch(err => {
        console.error("Không thể mở Camera:", err);
    });
});

        fetchEmployees();
    </script>
</body>
</html>
